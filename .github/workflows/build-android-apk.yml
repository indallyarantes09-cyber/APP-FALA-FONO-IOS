name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - FalaFono-Android.zip.b64
      - .github/workflows/build-android-apk.yml
  pull_request:
    branches: [main]
    paths:
      - FalaFono-Android.zip.b64
      - .github/workflows/build-android-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unpack Android project
        run: |
          base64 --decode FalaFono-Android.zip.b64 > FalaFono-Android.zip
          unzip -q FalaFono-Android.zip -d FalaFono-Android

      - name: Build debug APK
        run: cd FalaFono-Android && bash gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: FalaFono-Android-debug-APK
          path: FalaFono-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
